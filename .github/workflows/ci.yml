name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  node:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm test

  lean:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: leanprover/lean-action@v1
        with:
          auto-config: "false"
          build: "true"
          test: "false"
          lint: "false"
          leanchecker: "false"
          use-github-cache: "false"
          use-mathlib-cache: "false"

      - name: Check ShannonManifold with leanchecker
        run: lake env leanchecker --fresh ShannonManifold
